<style>
:root {

  --цвет-текст: #482D1F; --цвет-текст-мягкий: #80624D; --цвет-текст-тихий: #79624F;
  --цвет-акцент: #C77950; --цвет-акцент-тёмный: #80624D; --цвет-акцент-яркий: #C77950; --цвет-акцент-глубже: #614534; --цвет-акцент-маркер: #6F523F; --цвет-на-акценте: #F2E5D6; --цвет-линия: #DDC7AF;
  --цвет-тёмный-фон: #482D1F; --цвет-тёмный-фон-2: #80624D; --цвет-тёмный-текст: #F2E5D6; --цвет-тёмный-фон-3: #5E4231; --цвет-тёмный-фон-4: #482D1F;
  --цвет-тёплый: #C77950; --цвет-тёплый-мягкий: #DDC7AF; --цвет-стекло: color-mix(in srgb, #482D1F 86%, transparent);
  --тень: 0 12px 34px color-mix(in srgb, #482D1F 6%, transparent); --тень-чип: 0 10px 30px color-mix(in srgb, #482D1F 12%, transparent); --тень-глубокая: 0 24px 60px color-mix(in srgb, #482D1F 35%, transparent); --тень-спутник: 0 30px 60px color-mix(in srgb, #482D1F 70%, transparent); --тень-плиты: 0 40px 100px color-mix(in srgb, #482D1F 70%, transparent);
  --кегль-h1: 33px; --кегль-h2: clamp(28px, 4.5vw, 44px); --кегль-текст: clamp(16px, 1vw, 17px); --кегль-лид: clamp(17px, 1.1vw, 18px); --кегль-мелкий: 14px; --кегль-кикер: clamp(14px, 1.1vw, 15px); --кегль-цифра: 30px; --разрядка-кикера: .03em;
  --отступ-секции: clamp(64px, 10vw, 128px); --отступ-блока: clamp(20px, 2.5vw, 32px); --отступ-секции-тихо: clamp(50px, 7.8vw, 100px); --отступ-секции-громко: clamp(74px, 11.6vw, 148px); --ширина: 1120px; --ширина-колонки: 560px;
  --радиус: 16px; --радиус-малый: 8px; --радиус-карточки: 18px; --радиус-плитки: 22px; --радиус-телефон: 46px; --кнопка-радиус: 14px; --радиус-модуля: 16px; --нить: 2px; --плавность: cubic-bezier(.2, .7, .2, 1); --длительность: .25s;

.первый-экран--разворот .шапка__лого::before { content: ""; width: 22px; height: 22px; flex: 0 0 22px; background: linear-gradient(var(--цвет-текст) 0 0) 0 0/12px 2px no-repeat, linear-gradient(var(--цвет-текст) 0 0) 0 0/2px 12px no-repeat, linear-gradient(var(--цвет-текст) 0 0) 100% 0/12px 2px no-repeat, linear-gradient(var(--цвет-текст) 0 0) 100% 0/2px 12px no-repeat, linear-gradient(var(--цвет-текст) 0 0) 0 100%/12px 2px no-repeat, linear-gradient(var(--цвет-текст) 0 0) 0 100%/2px 12px no-repeat, linear-gradient(var(--цвет-акцент) 0 0) 100% 100%/12px 2px no-repeat, linear-gradient(var(--цвет-акцент) 0 0) 100% 100%/2px 12px no-repeat; }
@media (max-width: 899px) {

:root, .светлый { --цвет-кнопки: #80624D; --цвет-на-кнопке: #FBF7F2; --цвет-кнопки-навёл: #674E3E; }
.тёмный { --цвет-кнопки: #DDC7AF; --цвет-на-кнопке: #482D1F; --цвет-кнопки-навёл: #E9DBCC; }

</style>
<script>
(function () {
  var ЭТАЛОН = 0.535;                  // очко Open Sans — текстовой гарнитуры утверждённых макетов
  var ПОТОЛОК = 1.2, МЁРТВАЯ = 0.02;   // выше потолка расползается раскладка; ближе к единице не трогаем вовсе
  var КОМПЬЮТЕР = "(min-width: 900px)";
  var ТОКЕНЫ = ["--кегль-текст", "--кегль-лид", "--кегль-мелкий", "--кегль-кикер"];
  var корень = document.documentElement;
  var холст = document.createElement("canvas").getContext("2d");
  var ждём = 0;

  function мера(буква) { var м = холст.measureText(буква); return (м && м.actualBoundingBoxAscent) || 0; }

  function применить() {
    ждём = 0;
    if (!холст) { return; }

    for (var i = 0; i < ТОКЕНЫ.length; i++) { корень.style.removeProperty(ТОКЕНЫ[i]); }
    var стиль = getComputedStyle(корень), стек = стиль.getPropertyValue("--шрифт-текста").trim();
    if (!стек) { return; }
    холст.font = "400 100px " + стек;

    var очко = Math.max(мера("х"), мера("x")) / 100;
    if (!(очко > 0)) { return; }
    var k = Math.round(Math.min(ПОТОЛОК, Math.max(1, ЭТАЛОН / очко)) * 1000) / 1000;
    if (k - 1 < МЁРТВАЯ || !matchMedia(КОМПЬЮТЕР).matches) { k = 1; }
    корень.setAttribute("data-очко", очко.toFixed(3));      // чтобы проверка могла сказать числа вслух
    корень.setAttribute("data-поправка", k.toFixed(3));
    if (k === 1) { return; }
    for (i = 0; i < ТОКЕНЫ.length; i++) {
      var было = стиль.getPropertyValue(ТОКЕНЫ[i]).trim();
      if (было) { корень.style.setProperty(ТОКЕНЫ[i], "calc((" + было + ") * " + k + ")"); }
    }
  }

  применить();

  if (document.fonts && document.fonts.ready) { document.fonts.ready.then(применить); }

  addEventListener("resize", function () { ждём = ждём || requestAnimationFrame(применить); });
})();
</script>

<script>
(function () {
  var СПИТ = "главная-на-виду";                       // класс на body; правило сна — в стилях
  var кнопка = document.querySelector(".первый-экран__действие .кнопка--главная");
  if (!кнопка || !window.IntersectionObserver) { return; }

  function пометить(на_виду) { document.body.classList.toggle(СПИТ, !!на_виду); }

  var б = кнопка.getBoundingClientRect();
  пометить(б.bottom > 0 && б.top < (window.innerHeight || 0));

  requestAnimationFrame(function () {
    requestAnimationFrame(function () { document.body.classList.add("панель-с-переходом"); });
  });

  new IntersectionObserver(function (записи) {
    пометить(записи[записи.length - 1].isIntersecting);
  }, { threshold: 0 }).observe(кнопка);
})();
</script>
